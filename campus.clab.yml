name: campus-net-resilience

topology:
  groups:
    routers:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      daemons:
        - ospfd
    hosts:
      kind: linux
      image: wbitt/network-multitool:3.22.2

  nodes:
    r1:
      group: routers
      startup-config: configs/r1.frr.conf
    r2:
      group: routers
      startup-config: configs/r2.frr.conf
    r3:
      group: routers
      startup-config: configs/r3.frr.conf
    client:
      group: hosts
      exec:
        - ip link set eth1 up
        - ip addr add 10.20.10.10/24 dev eth1
        - ip route add 10.20.30.0/24 via 10.20.10.1 dev eth1
    server:
      group: hosts
      exec:
        - ip link set eth1 up
        - ip addr add 10.20.30.10/24 dev eth1
        - ip route add 10.20.10.0/24 via 10.20.30.1 dev eth1

  links:
    - endpoints: ["r1:eth1", "r2:eth1"] # backup, 10.0.12.0/30
    - endpoints: ["r2:eth2", "r3:eth1"] # backup, 10.0.23.0/30
    - endpoints: ["r1:eth2", "r3:eth2"] # primary, 10.0.13.0/30
    - endpoints: ["client:eth1", "r1:eth3"]
    - endpoints: ["server:eth1", "r3:eth3"]

name: Python checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Validate topology
        run: campus-net validate
      - name: Unit tests and statement coverage
        run: pytest -q --cov=campus_net --cov-report=term-missing --cov-fail-under=80

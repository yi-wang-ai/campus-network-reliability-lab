[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-network-reliability-lab"
version = "1.0.0"
description = "Reproducible OSPF failure-and-recovery network engineering lab"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7.0"]
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
campus-net = "campus_net.cli:main"

[tool.setuptools.packages.find]
include = ["campus_net*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
